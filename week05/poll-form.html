<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jaen Pierre Quispe Napuche">
    <link rel="stylesheet" href="./styles/poll-form.css">
    <title>HTML Forms</title>
</head>

<body>
    <h1>WDD130 | HTML Form - User Poll</h1>
    <main>
        <form action="">
            <fieldset title="Contact Information">
                <legend>Contact Information</legend>
                <div class="form-item column2">

                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullName" required>
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="text" id="useremail" name="useremail" required>
                </div>
                <div class="form-item column2">
                    <label for="quantity">Select Quantity</label>
                    <select name="quantity" id="quantity">
                        <option value="1">One</option>
                        <option value="2">Two</option>
                        <option value="3">Three</option>
                    </select>
                </div>
            </fieldset>
            <fieldset title="Questions">
                <legend>Questions</legend>
                <div class="form-item column1">

                    <label for="browser">What is your favorite internet browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-item column1">

                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="form-item column1">

                    <label for="feedback">List the places you have lived:</label>
                    <textarea name="feedback" id="feedback" rows="4"
                      placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>©2026 | WDD130 | HTML Form - User Poll | 🦝 Jaen Pierre Quispe Napuche 🦝 Peru</p>
    </footer>
</body>

</html>
