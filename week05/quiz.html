<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jaen Pierre Quispe Napuche">
    <link rel="stylesheet" href="./styles/quiz.css">
    <title>Quiz Form</title>
</head>

<body>
    <header>
        <h1>✅ Quiz Form - Basic HTML and CSS Quiz</h1>
    </header>
    <main>
        <form action="">
            <fieldset title="Questions">
                <div class="form-item">
                    <label for="q1">1. What HTML tag is used to define the main navigation
                        links?</label>
                    <input type="text" id="q1" name="q1">
                </div>
                <div class="form-item">
                    <label for="q2">2. Explain the difference between padding and margin in the CSS
                        box
                        model.</label>
                    <textarea id="q2" name="q2" rows="3"></textarea>
                </div>
                <div class="form-item">
                    <label for="q3">3. Which CSS property is used to change the text color?</label>
                    <select id="q3" name="q3">
                        <option value="" selected disabled>-- Choose One --</option>
                        <option value="color">color</option>
                        <option value="background-color">background-color</option>
                        <option value="text-color">text-color</option>
                    </select>
                </div>
                <div class="form-item">
                    <label for="q4">4. How many values can be defined when using the border-radius
                        shorthand
                        property?</label>
                    <input type="number" id="q4" name="q4">
                </div>
            </fieldset>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
    <footer>
        <p>©2026 | WDD130 | Quiz Form | 🦝 Jaen Pierre Quispe Napuche 🦝 Peru</p>
    </footer>
</body>

</html>
